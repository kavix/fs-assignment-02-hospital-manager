services:
  mysql:
    image: mysql:8.0
    container_name: hospital-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hospitaldb
      MYSQL_USER: hospital
      MYSQL_PASSWORD: hospital
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hospital-manager-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql-data:
