apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: hospital-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:5.2-apache
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PMA_HOST
              value: mysql
            - name: PMA_PORT
              value: "3306"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: hospital-manager
spec:
  type: NodePort
  selector:
    app: phpmyadmin
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
