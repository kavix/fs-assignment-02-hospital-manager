spring.application.name=hospital-manager
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:hospitaldb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
